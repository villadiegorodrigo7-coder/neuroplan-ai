name: NEUROPLAN AI - Android + Web

# Ambas plataformas se compilan desde el mismo commit y en paralelo.
on:
  push:
    branches: [main, feature/agenda-intervalos-recurrencias]
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Flutter packages
        run: flutter pub get

      - name: Generate native splash
        run: flutter pub run flutter_native_splash:create

      - name: Build APK
        run: flutter build apk --release

      - name: Guardar el APK como descargable
        uses: actions/upload-artifact@v4
        with:
          name: neuroplan-ai-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-web:
    name: Compilar aplicación Web
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Descargar el mismo commit
        uses: actions/checkout@v4

      - name: Instalar Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Flutter packages
        run: flutter pub get

      - name: Habilitar plataforma Web
        run: flutter create . --platforms=web --project-name neuroplan_ai

      - name: Build Web
        run: flutter build web --release

      - name: Guardar la Web como descargable
        uses: actions/upload-artifact@v4
        with:
          name: neuroplan-ai-web
          path: build/web/**
          if-no-files-found: error
