name: NEUROPLAN AI - Web

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Agregar soporte web
        run: flutter create . --platforms web

      - name: Instalar dependencias
        run: flutter pub get

      - name: Generar iconos propios Web
        run: dart run flutter_launcher_icons

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Compilar aplicación web
        run: flutter build web --release --base-href "/neuroplan-ai/" --pwa-strategy=none

      - name: Versionar los archivos de arranque
        run: |
          python3 - <<'PYTHON'
          import os
          import shutil
          from pathlib import Path

          carpeta = Path("build/web")
          version = os.environ["GITHUB_SHA"][:12]
          app = f"main.{version}.dart.js"
          arranque = f"flutter_bootstrap.{version}.js"
          bootstrap = (carpeta / "flutter_bootstrap.js").read_text()
          index = carpeta / "index.html"
          html = index.read_text()
          if '"main.dart.js"' not in bootstrap or '"flutter_bootstrap.js"' not in html:
              raise SystemExit("Cambió el formato del arranque web de Flutter.")

          shutil.copyfile(carpeta / "main.dart.js", carpeta / app)
          (carpeta / arranque).write_text(
              bootstrap.replace('"main.dart.js"', f'"{app}"')
          )
          # El favicon recibe un nombre por commit: evita que Chrome conserve
          # el icono antiguo de Flutter incluso despues de Ctrl+F5.
          favicon = f"neuroplan.{version}.png"
          shutil.copyfile(Path("assets/images/logo.png"), carpeta / favicon)
          html = html.replace('"flutter_bootstrap.js"', f'"{arranque}"')
          html = html.replace('href="favicon.png"', f'href="{favicon}"')
          index.write_text(html)

          # Sustituye el worker antiguo para que deje de interceptar recargas.
          (carpeta / "flutter_service_worker.js").write_text("""\
          self.addEventListener('install', event => {
            event.waitUntil(self.skipWaiting());
          });
          self.addEventListener('activate', event => {
            event.waitUntil(self.registration.unregister());
          });
          """)
          PYTHON

      - name: Subir aplicación web
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build-web
    runs-on: ubuntu-latest
    concurrency:
      group: neuroplan-github-pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
