name: NEUROPLAN AI - Web

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Agregar soporte web
        run: flutter create . --platforms web

      - name: Instalar dependencias
        run: flutter pub get

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Compilar aplicación web
        run: flutter build web --release --base-href "/neuroplan-ai/"

      - name: Subir aplicación web
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    needs: build-web
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
