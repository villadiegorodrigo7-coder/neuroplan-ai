workflows:
  android-workflow:
    name: NEUROPLAN AI - Android APK
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Generate native splash
        script: flutter pub run flutter_native_splash:create
      - name: Build APK (ofuscado)
        script: flutter build apk --release --obfuscate --split-debug-info=build/symbols
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/symbols/**

  web-workflow:
    name: NEUROPLAN AI - Web
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Habilitar web (crea la carpeta web si no existe)
        script: flutter create . --platforms=web --project-name neuroplan_ai
      - name: Build Web
        script: flutter build web --release
      - name: Comprimir el sitio
        script: cd build/web && zip -r ../neuroplan-web.zip .
    artifacts:
      - build/neuroplan-web.zip
